name: demo-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bundled demo smoke
        run: node scripts/smoke.mjs
      - name: Inventory demo
        run: node scripts/inventory-demo.mjs
      - name: Upload Artifacts (JSON + HTML report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            artifacts/smoke-report.json
            artifacts/smoke-report.html
          if-no-files-found: error
      - name: Upload Pages artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages

  pages:
    needs: smoke
    if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
